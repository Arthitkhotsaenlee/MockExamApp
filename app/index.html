<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b56e2">
  <meta name="description" content="Private, browser-based exam practice and learning application.">
  <title>Mock Exam application</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="tab" data-tab="load" aria-label="Open dashboard">
        <span class="brand-mark">C</span>
        <span><strong>Mock Exam Application</strong><small>Exam preparation</small></span>
      </button>
      <div class="topbar-actions">
        <span id="data-status" class="data-status"><span class="status-dot"></span><span>No question bank</span></span>
        <div class="font-size-controls" role="group" aria-label="Text size">
          <button id="font-decrease" class="font-size-button" data-action="font-decrease" aria-label="Decrease text size" title="Decrease text size">−</button>
          <span id="font-size-value" aria-live="polite">100%</span>
          <button id="font-increase" class="font-size-button" data-action="font-increase" aria-label="Increase text size" title="Increase text size">+</button>
        </div>
        <button id="reset-button" class="reset-button" data-action="reset" disabled title="Clear the question bank, saved progress, and display settings"><span class="reset-icon">↻</span><span class="reset-label">Reset app</span></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <p class="nav-label">Workspace</p>
        <nav aria-label="Main navigation">
          <button data-action="tab" data-tab="load"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
          <button data-action="tab" data-tab="mock"><span class="nav-icon">◷</span><span>Mock exam</span></button>
          <button data-action="tab" data-tab="learn"><span class="nav-icon">◇</span><span>Learning mode</span></button>
        </nav>
        <div class="privacy-note"><span>✓</span><div><strong>Private by design</strong><small>Your data stays in this browser.</small></div></div>
      </aside>
      <main id="main-content"></main>
    </div>
  </div>
</body>
</html>
